<script>
// GitHub Pages serves this for unknown paths. Map /laptop-research/<anything> to the SPA hash router.
(function(){var parts=location.pathname.split('/');var base='/'+(parts[1]||'')+'/';if(parts.length<3){base='/';}

location.replace(target+location.search+location.hash);})();
